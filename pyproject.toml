[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'ryuuseigun'
version = '0.9.0'
description = 'A small async Python web framework built around ASGI.'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.14'
dependencies = ['orjson>=3.11']

[project.urls]
Repository = 'https://github.com/depthbomb/ryuuseigun'
Issues = 'https://github.com/depthbomb/ryuuseigun/issues'

[project.optional-dependencies]
dev = ['build', 'twine', 'pytest', 'pytest-cov', 'ruff', 'mypy']
server = ['granian>=2.5']
compression = ['brotli>=1.1']
benchmark = ['quart>=0.23', 'starlette>=1.0']
examples = ['sqrrl>=0.4.1,<0.5', 'starlette>=1.0']

[tool.hatch.build.targets.sdist]
include = ['/ryuuseigun', '/tests', '/examples', '/benchmarks', '/README.md', '/LICENSE', '/pyproject.toml']

[tool.hatch.build.targets.wheel]
packages = ['ryuuseigun']

[tool.ruff]
target-version = 'py314'
line-length = 120

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'B']

[tool.mypy]
python_version = '3.14'
strict = true
packages = ['ryuuseigun']

[[tool.mypy.overrides]]
module = ['brotli']
ignore_missing_imports = true
